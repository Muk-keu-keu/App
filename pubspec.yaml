name: mukbang_ttaradamgi
description: "먹방 따라담기 — 릴스 속 맛집을 요기요 주문으로 이어주는 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리. SwiftUI 의 @EnvironmentObject + ObservableObject 자리를 대신한다.
  provider: ^6.1.2

  # Gemini / 메타데이터 HTTP 호출
  http: ^1.2.2

  # 안드로이드 공유 시트(ACTION_SEND) 수신
  receive_sharing_intent: ^1.9.0

  # iOS 공유 익스텐션이 mukbang:// 스킴으로 앱을 열 때 그 URL 을 받는다.
  # iOS 는 App Group 없이 검증된 Swift 익스텐션을 그대로 쓰기 위해 이 경로를 택했다.
  app_links: ^6.3.2

  # 요기요 앱 열기 (딥링크)
  url_launcher: ^6.3.1

  # API 키 등 환경변수를 .env 에서 읽는다. .env 는 커밋하지 않는다.
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # .env 는 gitignore 되지만 빌드 시 번들에 포함돼야 읽을 수 있다.
    - .env

  fonts:
    # Figma 시안과 동일한 Pretendard (SIL OFL). iOS 앱과 같은 파일을 쓴다.
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
