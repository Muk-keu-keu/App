name: mukbang_ttaradamgi
description: "먹방요기 — 릴스 속 맛집을 요기요 주문으로 이어주는 앱"
publish_to: 'none'

version: 1.1.0+18

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리. SwiftUI 의 @EnvironmentObject + ObservableObject 자리를 대신한다.
  provider: ^6.1.2

  # Gemini / 메타데이터 HTTP 호출
  http: ^1.2.2

  # multipart 파트의 Content-Type 을 지정하는 데 쓴다 (MediaType).
  # 사진을 application/octet-stream 으로 보내면 서버의 형식 검증에 걸린다.
  http_parser: ^4.0.2

  # 안드로이드 공유 시트(ACTION_SEND) 수신
  receive_sharing_intent: ^1.9.0

  # iOS 공유 익스텐션이 mukbang:// 스킴으로 앱을 열 때 그 URL 을 받는다.
  # iOS 는 App Group 없이 검증된 Swift 익스텐션을 그대로 쓰기 위해 이 경로를 택했다.
  app_links: ^6.3.2

  # 요기요 앱 열기 (딥링크)
  url_launcher: ^6.3.1

  # API 키 등 환경변수를 .env 에서 읽는다. .env 는 커밋하지 않는다.
  flutter_dotenv: ^5.2.1

  # 현재 좌표 수집. 배달 주소를 정하는 데 쓴다.
  geolocator: ^14.0.3

  # 좌표를 "구·동"으로 바꿔 화면에 보여주기 위한 것. **표시 전용**이다.
  # 서버로는 여전히 좌표만 보낸다. OS 지오코더를 쓰므로 API 키가 필요 없다.
  geocoding: ^5.0.0
  # Figma 아이콘을 SVG 원본 그대로 렌더링한다. 벡터라 어느 해상도에서도 선명하다.
  flutter_svg: ^2.3.0

  # 로그인 토큰을 앱을 껐다 켜도 남기기 위한 것. 자동 로그인이 이것으로 돈다.
  # 키체인이 아니라 UserDefaults/SharedPreferences 라 기기를 뜯으면 토큰이 보인다.
  # 데모 단계라 이대로 두고, 실서비스에서는 flutter_secure_storage 로 옮겨야 한다.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/home/
    - assets/images/guide/
    - assets/icons/
    # .env 는 gitignore 되지만 빌드 시 번들에 포함돼야 읽을 수 있다.
    - .env

  fonts:
    # 배너·섹션 워드마크용 디스플레이 폰트. 시안에 쓰인 것과 같은 파일이다.
    - family: WAGURI
      fonts:
        - asset: assets/fonts/WAGURI-Regular.otf

    # 본문 전반. Figma 시안과 동일한 Pretendard (SIL OFL).
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
